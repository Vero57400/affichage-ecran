<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joyeuses Pâques</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --mint: #a8d8b9;
    --lilac: #c9b8e8;
    --butter: #f7e98e;
    --peach: #f4b8a0;
    --sky: #b8d8f0;
    --deep: #3a2d5c;
    --gold: #d4a843;
  }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #f5f0e8;
    font-family: 'Lato', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Background */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(168,216,185,0.35) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 30%, rgba(201,184,232,0.35) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 90%, rgba(244,184,160,0.25) 0%, transparent 50%),
      linear-gradient(160deg, #fdf8f0 0%, #f0eadc 100%);
  }

  /* Scattered dots pattern */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(58,45,92,0.08) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Decorative blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.4;
    animation: float 6s ease-in-out infinite;
  }
  .blob-1 { width:500px;height:500px; background:var(--mint); top:-100px;left:-100px; animation-delay:0s; }
  .blob-2 { width:400px;height:400px; background:var(--lilac); bottom:-80px;right:-80px; animation-delay:-2s; }
  .blob-3 { width:300px;height:300px; background:var(--peach); top:200px;right:100px; animation-delay:-4s; }

  @keyframes float {
    0%,100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  /* Eggs decoratifs */
  .egg-container {
    position: absolute; inset: 0; pointer-events: none;
  }
  .egg {
    position: absolute;
    animation: wobble 4s ease-in-out infinite;
  }
  @keyframes wobble {
    0%,100% { transform: rotate(-5deg) translateY(0); }
    50% { transform: rotate(5deg) translateY(-8px); }
  }
  .egg svg { display: block; }

  /* Main content */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Pre-title */
  .pre-title {
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 22px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: var(--deep);
    opacity: 0.55;
    margin-bottom: 18px;
    animation: fadeDown 1.2s ease both 0.3s;
  }

  /* Title */
  .title {
    font-family: 'Playfair Display', serif;
    font-size: 148px;
    font-weight: 700;
    line-height: 0.9;
    color: var(--deep);
    letter-spacing: -2px;
    animation: fadeDown 1.2s ease both 0.5s;
    position: relative;
  }
  .title .accent {
    font-style: italic;
    color: transparent;
    -webkit-text-stroke: 2px var(--deep);
  }
  .title .gold-word {
    color: var(--gold);
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 30px 0 28px;
    animation: fadeIn 1.2s ease both 0.9s;
  }
  .divider-line { width: 120px; height: 1px; background: var(--deep); opacity: 0.3; }
  .divider-icon { font-size: 28px; }

  /* Subtitle */
  .subtitle {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 34px;
    color: var(--deep);
    opacity: 0.75;
    letter-spacing: 1px;
    animation: fadeUp 1.2s ease both 1s;
    max-width: 820px;
    line-height: 1.5;
  }

  /* Badge */
  .badge {
    margin-top: 48px;
    padding: 14px 48px;
    border: 1.5px solid rgba(58,45,92,0.2);
    border-radius: 100px;
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(8px);
    font-size: 17px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--deep);
    font-weight: 400;
    animation: fadeUp 1.2s ease both 1.2s;
  }

  @keyframes fadeDown {
    from { opacity:0; transform:translateY(-24px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity:0; }
    to   { opacity:1; }
  }

  /* Petals */
  .petal {
    position: absolute;
    width: 12px; height: 18px;
    border-radius: 50% 50% 50% 0;
    opacity: 0;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { opacity:0; transform: translateY(-50px) rotate(0deg); }
    10%  { opacity:0.7; }
    90%  { opacity:0.5; }
    100% { opacity:0; transform: translateY(1140px) rotate(720deg) translateX(80px); }
  }

  /* Rabbit SVG */
  .rabbit-svg {
    position: absolute;
    bottom: 30px;
    left: 80px;
    animation: bounceRabbit 2.8s ease-in-out infinite;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,0.15));
  }
  @keyframes bounceRabbit {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-16px) rotate(2deg); }
  }

  /* Chick bottom-right */
  .chick {
    position: absolute;
    bottom: 60px;
    right: 140px;
    font-size: 72px;
    animation: bounceChick 2.5s ease-in-out infinite;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.12));
  }
  @keyframes bounceChick {
    0%,100% { transform:translateY(0) rotate(-3deg); }
    50% { transform:translateY(-12px) rotate(3deg); }
  }

  /* Flower corners */
  .corner { position: absolute; font-size: 52px; animation: spin 8s linear infinite; opacity: 0.6; }
  .corner-tl { top: 40px; left: 50px; }
  .corner-tr { top: 40px; right: 50px; animation-direction: reverse; }
  .corner-bl { bottom: 40px; left: 50px; animation-direction: reverse; }
  .corner-br { bottom: 40px; right: 50px; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="dots"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<!-- Fleurs aux coins -->
<div class="corner corner-tl">🌸</div>
<div class="corner corner-tr">🌼</div>
<div class="corner corner-bl">🌼</div>
<div class="corner corner-br">🌸</div>

<!-- Pétales qui tombent -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const colors = ['#f4b8a0','#c9b8e8','#a8d8b9','#f7e98e','#f8c8d0'];
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.style.left = Math.random()*100 + '%';
      p.style.top = '-30px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration = (7 + Math.random()*8) + 's';
      p.style.animationDelay = (Math.random()*10) + 's';
      p.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(p);
    }
  });
</script>

<!-- Œufs décoratifs -->
<div class="egg-container">
  <!-- Egg top-left -->
  <div class="egg" style="top:80px;left:260px;animation-delay:-1s;">
    <svg width="70" height="90" viewBox="0 0 70 90">
      <ellipse cx="35" cy="48" rx="32" ry="40" fill="#f4b8a0" stroke="white" stroke-width="2"/>
      <path d="M 5 48 Q 35 30 65 48" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
      <path d="M 5 56 Q 35 38 65 56" fill="none" stroke="white" stroke-width="2.5" opacity="0.5"/>
    </svg>
  </div>
  <!-- Egg top-right -->
  <div class="egg" style="top:100px;right:300px;animation-delay:-2.5s;">
    <svg width="60" height="78" viewBox="0 0 60 78">
      <ellipse cx="30" cy="42" rx="27" ry="35" fill="#c9b8e8" stroke="white" stroke-width="2"/>
      <circle cx="20" cy="35" r="5" fill="white" opacity="0.5"/>
      <circle cx="35" cy="28" r="4" fill="white" opacity="0.5"/>
      <circle cx="40" cy="48" r="6" fill="white" opacity="0.4"/>
    </svg>
  </div>
  <!-- Egg bottom-center-left -->
  <div class="egg" style="bottom:120px;left:420px;animation-delay:-3.5s;">
    <svg width="55" height="70" viewBox="0 0 55 70">
      <ellipse cx="27" cy="38" rx="24" ry="32" fill="#a8d8b9" stroke="white" stroke-width="2"/>
      <path d="M 5 36 L 49 36" stroke="white" stroke-width="3" opacity="0.6"/>
      <path d="M 5 44 L 49 44" stroke="white" stroke-width="3" opacity="0.6"/>
    </svg>
  </div>
  <!-- Egg bottom-right area -->
  <div class="egg" style="bottom:130px;right:420px;animation-delay:-0.5s;">
    <svg width="65" height="82" viewBox="0 0 65 82">
      <ellipse cx="32" cy="44" rx="29" ry="38" fill="#f7e98e" stroke="white" stroke-width="2"/>
      <path d="M 5 38 Q 32 24 59 38 Q 32 52 5 38" fill="white" opacity="0.3"/>
      <path d="M 5 50 Q 32 36 59 50 Q 32 64 5 50" fill="white" opacity="0.2"/>
    </svg>
  </div>
</div>

<!-- SVG Rabbit -->
<div class="rabbit-svg">
  <svg width="200" height="260" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
    <!-- Ear left -->
    <ellipse cx="72" cy="72" rx="22" ry="58" fill="#f0dde8" stroke="#d4a0b8" stroke-width="2.5"/>
    <ellipse cx="72" cy="72" rx="12" ry="44" fill="#f4b8ce" opacity="0.7"/>
    <!-- Ear right -->
    <ellipse cx="128" cy="72" rx="22" ry="58" fill="#f0dde8" stroke="#d4a0b8" stroke-width="2.5"/>
    <ellipse cx="128" cy="72" rx="12" ry="44" fill="#f4b8ce" opacity="0.7"/>
    <!-- Body -->
    <ellipse cx="100" cy="190" rx="62" ry="68" fill="#f5efe8" stroke="#d4bfa8" stroke-width="2.5"/>
    <!-- Belly -->
    <ellipse cx="100" cy="200" rx="38" ry="46" fill="#fdf8f4" opacity="0.8"/>
    <!-- Head -->
    <circle cx="100" cy="128" r="52" fill="#f5efe8" stroke="#d4bfa8" stroke-width="2.5"/>
    <!-- Eyes -->
    <circle cx="82" cy="120" r="8" fill="#3a2d5c"/>
    <circle cx="118" cy="120" r="8" fill="#3a2d5c"/>
    <circle cx="85" cy="117" r="3" fill="white"/>
    <circle cx="121" cy="117" r="3" fill="white"/>
    <!-- Nose -->
    <ellipse cx="100" cy="136" rx="7" ry="5" fill="#f4a0b0"/>
    <!-- Mouth -->
    <path d="M 93 141 Q 100 148 107 141" fill="none" stroke="#c47888" stroke-width="2" stroke-linecap="round"/>
    <!-- Whiskers left -->
    <line x1="60" y1="134" x2="90" y2="137" stroke="#c4a898" stroke-width="1.5" opacity="0.7"/>
    <line x1="58" y1="140" x2="90" y2="140" stroke="#c4a898" stroke-width="1.5" opacity="0.7"/>
    <!-- Whiskers right -->
    <line x1="140" y1="134" x2="110" y2="137" stroke="#c4a898" stroke-width="1.5" opacity="0.7"/>
    <line x1="142" y1="140" x2="110" y2="140" stroke="#c4a898" stroke-width="1.5" opacity="0.7"/>
    <!-- Chocolate egg held -->
    <ellipse cx="100" cy="248" rx="28" ry="18" fill="#7b4a2d" stroke="#5c3520" stroke-width="2"/>
    <path d="M 75 248 Q 100 236 125 248" fill="#9b6a4d" opacity="0.5"/>
    <text x="100" y="253" text-anchor="middle" font-size="11" fill="#f7e98e" font-family="serif" font-weight="bold">🍫</text>
    <!-- Arms holding egg -->
    <path d="M 42 185 Q 65 230 75 248" fill="none" stroke="#d4bfa8" stroke-width="14" stroke-linecap="round"/>
    <path d="M 158 185 Q 135 230 125 248" fill="none" stroke="#d4bfa8" stroke-width="14" stroke-linecap="round"/>
    <!-- Tail -->
    <circle cx="152" cy="230" r="16" fill="white" opacity="0.9"/>
    <circle cx="152" cy="230" r="12" fill="#f5efe8"/>
  </svg>
</div>

<!-- Chick -->
<div class="chick">🐣</div>

<!-- Main content -->
<div class="content">
  <div class="title" style="margin-bottom:0;">
    Joyeuses <span class="gold-word">Pâques</span> à tous&nbsp;!
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-icon">🥚</span>
    <div class="divider-line"></div>
  </div>

  <div class="badge" style="font-size:26px; letter-spacing:3px; padding:20px 64px;">✦ Profitez bien de ce long week-end en famille 🐣 ✦</div>
</div>

</body>
</html>
